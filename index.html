<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面相指路，靈籤定運</title>
  
  <!-- SEO 基本 Meta Tags -->
  <meta name="description" content="從五官看你馬年運勢，仙女下凡來解答！馬上點擊下方籤筒，即可得你的專屬幸運靈籤~">
  <meta name="robots" content="index, follow">
  
  <!-- LINE 專用 OG Tags -->
  <meta property="line:card" content="summary_large_image">
  <meta property="line:title" content="面相指路，靈籤定運">
  <meta property="line:description" content="從五官看你馬年運勢，仙女下凡來解答！馬上點擊下方籤筒，即可得你的專屬幸運靈籤~">
  <!-- 下方 line:image / og:url / og:image 會在腳本中依據 window.endpoint.domain 動態覆寫 -->
  <meta id="line-og-image" property="line:image" content="">
  
  <!-- 標準 Open Graph Tags -->
  <meta property="og:type" content="website">
  <meta id="og-url" property="og:url" content="">
  <meta property="og:title" content="面相指路，靈籤定運">
  <meta property="og:description" content="從五官看你馬年運勢，仙女下凡來解答！馬上點擊下方籤筒，即可得你的專屬幸運靈籤~">
  <meta id="og-image" property="og:image" content="">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="面相指路，靈籤定運">
  <meta property="og:site_name" content="面相指路，靈籤定運">
  <meta property="og:locale" content="zh_TW">
  
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- 全局配置 - 可在打包後直接修改 -->
  <script>
      // ===== Domain / API 配置 =====
    // 這些配置可以在打包後的 dist 目錄中直接修改
    window.endpoint = {
      // 前端與 OG / 分享共用的網域設定（後端如需更換 domain，改這裡即可）
      domain: 'https://line-liff-face-swap-draw-lots-2026.vercel.app',
      // API 基礎 URL - 修改這裡來改變 API 伺服器地址
      baseURL: 'https://stg-line-crm.fanpokka.ai/api',
      // 認證 Token
      authToken: '123',
      // 請求超時時間（毫秒）
      timeout: 30000,
      // 調試模式 - 設為 true 可以在控制台看到詳細日誌
      debug: true,
      
      // ===== 圖片處理 API 配置 =====
      // 圖片處理 API 端點 - 修改這裡來改變圖片處理服務器
      imageProcessApi: 'https://stg-api.fanpokka.ai/api/static-resource',
      // 圖片處理參數 - 修改這裡來調整圖片處理效果
      imageProcessParams: {
        scale: 2,        // 圖片縮放比例：0.5, 1, 1.5, 2
        format: 'jpg',   // 圖片格式：jpg, png, webp
        quality: 90,     // 圖片品質：1-100
        width: 800,      // 圖片寬度（像素）
        height: 600      // 圖片高度（像素）
      },
      // 是否啟用圖片處理功能
      enableImageProcessing: true,
      
      
      // ===== LIFF 配置 =====
      // LIFF ID - 修改這裡來改變 LIFF 應用 ID
      liffId: '2008136985-AmcxzlBy',
      // LINE Basic ID - 修改這裡來改變 LINE 官方帳號 ID
      basicId: '@299fvzdf',
      // 是否啟用 LIFF 功能
      enableLiff: true,
      testUserId: 'dev_user_'
    };
    
    // 動態設定 OG / LINE 圖片與 URL
    // 等待模組載入後獲取 og 圖片路徑（包含 hash）
    (function() {
      function setOgImage() {
        try {
          var domain = (window.endpoint && window.endpoint.domain) || '';
          if (!domain) return;
          
          var ogUrl = document.getElementById('og-url');
          var ogImage = document.getElementById('og-image');
          var lineImage = document.getElementById('line-og-image');
          
          if (ogUrl) ogUrl.setAttribute('content', domain + '/');
          
          // 嘗試從 window.imageUrls 獲取 og 圖片路徑（包含 hash）
          // 如果還沒載入，使用 fallback 路徑
          var ogImagePath = '';
          if (window.imageUrls && window.imageUrls.og) {
            // 如果是完整 URL，直接使用；如果是相對路徑，加上 domain
            ogImagePath = window.imageUrls.og.startsWith('http') 
              ? window.imageUrls.og 
              : domain + window.imageUrls.og.replace(/^\./, '');
          } else {
            // Fallback: 使用固定路徑（如果模組還沒載入）
            ogImagePath = domain + '/images/draw_lots_2026/og.png';
          }
          
          if (ogImage) ogImage.setAttribute('content', ogImagePath);
          if (lineImage) lineImage.setAttribute('content', ogImagePath);
        } catch (e) {
          console.error('設定 OG / LINE 圖片失敗:', e);
        }
      }
      
      // 立即執行一次（使用 fallback）
      setOgImage();
      
      // 監聽 window.imageUrls 是否已載入
      var checkInterval = setInterval(function() {
        if (window.imageUrls && window.imageUrls.og) {
          clearInterval(checkInterval);
          setOgImage(); // 重新設定正確的路徑
        }
      }, 100);
      
      // 10 秒後停止檢查（避免無限循環）
      setTimeout(function() {
        clearInterval(checkInterval);
      }, 10000);
    })();
    
    // 輸出配置到控制台（如果啟用調試模式）
    if (window.endpoint.debug) {
      console.log('🔧 當前 API 配置:', window.endpoint);
      
      // 檢查是否在開發環境
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('🌐 檢測到本地開發環境');
        if (!window.endpoint.enableLiff) {
          console.log('🔧 開發模式：LIFF 功能已關閉');
          console.log('💡 現在可以測試圖片生成功能而不會觸發 LIFF 錯誤');
        }
      }
      
      // 輸出圖片處理 API 配置
      if (window.endpoint.enableImageProcessing) {
        console.log('🖼️ 圖片處理 API 配置:');
        console.log('  - 端點:', window.endpoint.imageProcessApi);
        console.log('  - 參數:', window.endpoint.imageProcessParams);
        console.log('💡 修改這些配置可以調整圖片處理效果');
      }
    }
  </script>
  
  <script type="module" src="/resources/js/app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: transparent;
      min-height: 100vh;
    }
    
    #vue-root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="vue-root" data-component="FaceSwapApp"></div>
</body>
</html>
