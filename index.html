  <!-- og:image 使用相對路徑（後備值），og:url 會在腳本中依據 window.endpoint.domain 動態設置完整 URL -->

  <!-- Canonical URL -->

  <!-- Structured Data (JSON-LD) -->

  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "面相指路，靈籤定運",
    "description": "從五官看你馬年運勢，仙女下凡來解答！馬上點擊下方籤筒，即可得你的專屬幸運靈籤~",
    "url": ""
  }
  </script>
  
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- 全局配置 - 可在打包後直接修改 -->
  <script>
      // ===== Domain / API 配置 =====
    // 這些配置可以在打包後的 dist 目錄中直接修改
    window.endpoint = {
      // 前端與 OG / 分享共用的網域設定（後端如需更換 domain，改這裡即可）
      domain: 'https://line-liff-face-swap-draw-lots-2026.vercel.app',
      // API 基礎 URL - 修改這裡來改變 API 伺服器地址
      baseURL: 'https://stg-line-crm.fanpokka.ai/api',
      // 認證 Token
      authToken: '123',
      // 請求超時時間（毫秒）
      timeout: 30000,
      // 調試模式 - 設為 true 可以在控制台看到詳細日誌
      debug: true,
      // 從後端傳遞是否關閉服務的狀態（開發時預設為 false，後端會用 Blade 模板語法覆蓋）
      isClosed: false,
      // Fanpokka 粉絲通行證連結（預留功能，後端可配置）
      fanpokkaLink: '#',
      
      // ===== 圖片處理 API 配置 =====
      // 圖片處理 API 端點 - 修改這裡來改變圖片處理服務器
      imageProcessApi: 'https://stg-api.fanpokka.ai/api/static-resource',
      // 圖片處理參數 - 修改這裡來調整圖片處理效果
      imageProcessParams: {
        scale: 2,        // 圖片縮放比例：0.5, 1, 1.5, 2
        format: 'jpg',   // 圖片格式：jpg, png, webp
        quality: 90,     // 圖片品質：1-100
        width: 800,      // 圖片寬度（像素）
        height: 600      // 圖片高度（像素）
      },
      // 是否啟用圖片處理功能
      enableImageProcessing: true,
      
      
      // ===== LIFF 配置 =====
      // LIFF ID - 修改這裡來改變 LIFF 應用 ID
      liffId: '2008136985-AmcxzlBy',
      // LINE Basic ID - 修改這裡來改變 LINE 官方帳號 ID
      basicId: '@299fvzdf',
      // 是否啟用 LIFF 功能
      enableLiff: true,
      testUserId: 'dev_user_',
      
      // ===== 模式配置 =====
      // 模式：'auto' 自動偵測 | 'liff' 強制 LIFF 模式 | 'email' 強制 Email 模式
      // 自動偵測邏輯：檢查是否在 LIFF 環境，是則使用 'liff'，否則使用 'email'
      // 也可以透過 URL 參數 ?mode=liff 或 ?mode=email 來覆蓋此設定
      mode: 'auto'
    };
    
    // 動態設定 OG / LINE 圖片與 URL
    (function () {
      try {
        var domain = (window.endpoint && window.endpoint.domain) || '';
        
        // og:url 使用完整 URL（符合 Open Graph 協議標準）
        var ogUrl = document.getElementById('og-url');
        if (ogUrl && domain) {
          ogUrl.setAttribute('content', domain);
          if (window.endpoint.debug) {
            console.log('🔗 OG URL 已設置:', domain);
          }
        } else if (ogUrl && !domain) {
          console.warn('⚠️ window.endpoint.domain 未設置，og:url 將使用空值');
        }
        
        // og:image 和 line:image 使用相對路徑（後端要求）
        var ogImagePath = '/images/draw_lots_2026/og.png';
        var ogImage = document.getElementById('og-image');
        var lineImage = document.getElementById('line-og-image');
        
        if (ogImage) {
          ogImage.setAttribute('content', ogImagePath);
          if (window.endpoint.debug) {
            console.log('🖼️ OG Image 已設置:', ogImagePath);
          }
        }
        
        if (lineImage) {
          lineImage.setAttribute('content', ogImagePath);
          if (window.endpoint.debug) {
            console.log('🖼️ LINE Image 已設置:', ogImagePath);
          }
        }
        
        // 設置 Twitter Card image
        var twitterImage = document.getElementById('twitter-image');
        if (twitterImage) {
          twitterImage.setAttribute('content', ogImagePath);
          if (window.endpoint.debug) {
            console.log('🖼️ Twitter Image 已設置:', ogImagePath);
          }
        }
        
        // 設置 Canonical URL
        var canonicalUrl = document.getElementById('canonical-url');
        if (canonicalUrl && domain) {
          canonicalUrl.setAttribute('href', domain);
          if (window.endpoint.debug) {
            console.log('🔗 Canonical URL 已設置:', domain);
          }
        }
        
        // 更新 Structured Data URL
        var structuredDataScript = document.querySelector('script[type="application/ld+json"]');
        if (structuredDataScript && domain) {
          try {
            var structuredData = JSON.parse(structuredDataScript.textContent);
            structuredData.url = domain;
            structuredDataScript.textContent = JSON.stringify(structuredData);
            if (window.endpoint.debug) {
              console.log('📊 Structured Data URL 已設置:', domain);
            }
          } catch (e) {
            console.warn('⚠️ 更新 Structured Data 失敗:', e);
          }
        }
      } catch (e) {
        console.error('❌ 設定 OG / LINE 圖片失敗:', e);
      }
    })();
    
    // 輸出配置到控制台（如果啟用調試模式）
    if (window.endpoint.debug) {
      console.log('🔧 當前 API 配置:', window.endpoint);
      
      // 檢查是否在開發環境
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('🌐 檢測到本地開發環境');
        if (!window.endpoint.enableLiff) {
          console.log('🔧 開發模式：LIFF 功能已關閉');
          console.log('💡 現在可以測試圖片生成功能而不會觸發 LIFF 錯誤');
        }
      }
      
      // 輸出圖片處理 API 配置
      if (window.endpoint.enableImageProcessing) {
        console.log('🖼️ 圖片處理 API 配置:');
        console.log('  - 端點:', window.endpoint.imageProcessApi);
        console.log('  - 參數:', window.endpoint.imageProcessParams);
        console.log('💡 修改這些配置可以調整圖片處理效果');
      }
    }
  </script>
